name: build-exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CM_Kadro_Tamamlayici cm_kadro_tamamlayici.py
      - uses: actions/upload-artifact@v4
        with: { name: CM_Kadro_Tamamlayici, path: dist/CM_Kadro_Tamamlayici.exe }
      - name: Release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create v1-${{ github.run_number }} dist/CM_Kadro_Tamamlayici.exe --title "CM Kadro Tamamlayici" --notes "Windows exe" 
    permissions: { contents: write }
